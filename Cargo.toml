[workspace]
resolver = "2"
members = [
    "crates/dfin-proto",
    "crates/dfin-net",
    "crates/dfin-llama-sys",
    "crates/dfin-llama",
    "crates/dfin",
    "crates/dfin-fuzz",
]
# The cargo-fuzz driver needs nightly; it is built on its own (see fuzz/Cargo.toml).
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
half = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["json", "macros"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.8"
bytes = "1"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

[profile.release]
debug = 1

# Unoptimised curve arithmetic makes a signature check cost milliseconds, and the tests
# sign, verify, seal and open thousands of times; keep the crypto fast in debug builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
